{% for msg in messages %}
<div class="d-flex {% if msg.direction == "out" %}justify-content-end{% endif %}">
  <div class="rounded p-2 px-3 {% if msg.direction == "out" %}bg-success text-white{% else %}bg-light border{% endif %}"
       style="max-width:75%">
    <div style="font-size:14px">{{ msg.message }}</div>
    <div class="d-flex align-items-center gap-1 mt-1 {% if msg.direction == "out" %}justify-content-end{% endif %}">
      <small class="{% if msg.direction == "out" %}text-white-50{% else %}text-muted{% endif %}" style="font-size:11px">
        {{ msg.created_at|date:"d M H:i" }}
      </small>
      {% if msg.direction == "out" %}
      <small class="text-white-50" style="font-size:11px">
        {% if msg.status == "read" %}<i class="bi bi-check2-all"></i>
        {% elif msg.status == "delivered" %}<i class="bi bi-check2-all"></i>
        {% else %}<i class="bi bi-check2"></i>{% endif %}
      </small>
      {% endif %}
    </div>
  </div>
</div>
{% empty %}
<div class="text-center text-muted py-5">No messages yet</div>
{% endfor %}
